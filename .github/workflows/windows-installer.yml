name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout DesktopCraft source
        uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and builds
        uses: Swatinem/rust-cache@v2
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version\s*=\s*"(\d+\.\d+\.\d+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Git tag and Cargo.toml version do not match" }
      - name: Run unit tests
        shell: pwsh
        run: cargo test --locked --release
      - name: Compile Windows x64 release
        shell: pwsh
        run: cargo build --locked --release
      - name: Validate and package self-installer
        shell: pwsh
        run: ./scripts/package-release.ps1 -Destination dist
      - name: Upload Windows installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCraft-Windows-x64
          path: |
            dist/DesktopCraft-v*-Setup-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release assets for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DesktopCraft-v*-Setup-x64.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
