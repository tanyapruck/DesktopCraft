name: DesktopCraft beta bug
description: Report a reproducible issue found during private Windows beta testing.
title: "[Beta] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing DesktopCraft. **Do not upload personal files, real desktop screenshots, API keys, credentials, or sensitive logs**. Describe behavior with sanitized examples.
  - type: dropdown
    id: installer
    attributes:
      label: Installer type
      options:
        - Standalone EXE
        - MSI experimental
        - Build from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DesktopCraft version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe what you clicked and what happened, without real file paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual result
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details (optional)
      description: Monitor scaling, whether another desktop organizer is running, and whether this involves a virtual Box or Folder View.
