[package]
name = "desktopcraft"
version = "0.3.2"
edition = "2021"
license = "MIT"
# The product. The lab programs below are opt-in (`--features native-lab`).
default-run = "desktopcraft"

[features]
profile-alloc = []
native-lab = []
# Dedicated native production candidate: embeds the independently built
# matching Explorer filter DLL inside the same verified Windows EXE.
# Requires a matching, independently built native filter DLL.
native-release = []
native-fast-tabs = ["native-release"]
# Explicit opt-in at compile time for the old Explorer MouseDown experiment.
# Normal Debug/Release builds cannot arm the hazardous injection path.

[dependencies]
macroquad = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "shellapi", "commdlg", "shlobj", "combaseapi", "objbase", "processthreadsapi", "wingdi", "winreg", "libloaderapi", "winerror", "winnt", "handleapi", "dwmapi"] }

[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
# Local fork for accumulating high-resolution Windows mouse wheel events;
# never modify the checksummed registry copy in vendor/crates.
macroquad = { path = "vendor/macroquad" }

[[bin]]
name = "desktopcraft"
path = "src/main.rs"

[[bin]]
name = "native-box-sandbox"
path = "src/bin/native_box_sandbox.rs"
required-features = ["native-lab"]

[[bin]]
name = "native-box-macroquad-lab"
path = "src/bin/native_box_macroquad_lab.rs"
required-features = ["native-lab"]

[profile.release]
opt-level = 2


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("native-unsafe-drag-lab"))'] }
